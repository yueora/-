<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YUEORA | The Echo of Melodies</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://upload.wikimedia.org" crossorigin>
<link rel="preconnect" href="https://commons.wikimedia.org" crossorigin>
<link rel="preconnect" href="https://i1.sndcdn.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>
 :root{
color-scheme:dark;
--bg:#090B14;--panel:#151A2B;--panel2:#1D2438;
--text:#F4F3FA;--muted:#A9AEC4;--purple:#6C63FF;
--cyan:#29C7D8;--pink:#B58CFF;--border:rgba(210,218,255,.11);
--surface-raised:#171E31;--header-bg:rgba(9,11,20,.94);--player-bg:rgba(13,16,29,.96);
--shadow:rgba(0,0,0,.32);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Vazirmatn',sans-serif;min-height:100vh;overflow-x:hidden}
button,input{font-family:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}

header{
height:76px;padding:0 6%;display:flex;align-items:center;
justify-content:space-between;border-bottom:1px solid var(--border);
background:rgba(9,9,16,.94);position:sticky;top:0;z-index:20;
backdrop-filter:blur(18px)
}
.logo{
font-size:27px;font-weight:800;letter-spacing:3px;direction:ltr;
background:linear-gradient(110deg,#fff,#b68aff,#ed68c8);
-webkit-background-clip:text;color:transparent
}
nav{display:flex;align-items:center;gap:25px}
.language-picker{background:var(--panel2);border:1px solid var(--border);color:#eee5ff;border-radius:10px;padding:8px 10px;font-size:12px;max-width:145px;outline:none}
.language-picker option{background:#171522;color:white}
@media(max-width:850px){.language-picker{margin-inline-start:auto;margin-inline-end:10px;max-width:125px}}
nav button{background:none;border:0;color:#c4bfd3;font-size:14px}
nav button:hover{color:white}
.menu-btn{display:none;background:var(--panel2);border:1px solid var(--border);color:white;border-radius:12px;padding:9px 13px;font-size:20px}
main{width:100%;max-width:1250px;margin:auto;padding:35px 5% 120px}

/* هدر سه‌بعدی و نت‌های شناور */
.hero{
min-height:310px;padding:45px;border-radius:27px;display:flex;
align-items:center;overflow:hidden;position:relative;isolation:isolate;
perspective:900px;transform-style:preserve-3d;
background:
radial-gradient(circle at 15% 30%,rgba(237,104,200,.25),transparent 32%),
radial-gradient(circle at 80% 70%,rgba(155,101,255,.3),transparent 35%),
linear-gradient(125deg,#191328,#171426,#10101b);
border:1px solid rgba(190,150,255,.18);
box-shadow:inset 0 1px 1px #ffffff12,0 22px 60px #0008,
0 0 45px rgba(155,101,255,.08);
margin-bottom:48px
}
.hero-content{position:relative;z-index:5;max-width:650px;transform:translateZ(45px)}
.hero h1{font-size:clamp(28px,5vw,48px);line-height:1.5;text-shadow:0 5px 25px #0008}
.hero h1 span{background:linear-gradient(90deg,#c19aff,#f18bd5);-webkit-background-clip:text;color:transparent}
.hero p{color:#b7b1c7;margin-top:12px;max-width:520px;line-height:2}
.hero-orb{
position:absolute;width:230px;height:230px;border-radius:50%;
left:10%;top:20px;z-index:-1;
background:linear-gradient(140deg,rgba(155,101,255,.3),rgba(237,104,200,.18));
filter:blur(2px);box-shadow:0 0 100px rgba(155,101,255,.25);
transform:translateZ(30px)
}
.music-notes{
position:absolute;inset:0;overflow:hidden;pointer-events:none;
transform-style:preserve-3d;z-index:2
}
.music-note{
position:absolute;left:var(--x);top:var(--y);
font-size:var(--size);color:var(--note-color);
opacity:var(--opacity);filter:drop-shadow(0 0 12px currentColor);
text-shadow:0 0 18px currentColor;
transform:translate3d(0,0,var(--depth));
will-change:transform;
animation:noteFloat var(--duration) ease-in-out infinite alternate;
transition:transform .22s ease-out
}
@keyframes noteFloat{
0%{margin-top:-9px;rotate:-9deg}
100%{margin-top:13px;rotate:10deg}
}
.motion-control{
position:absolute;left:18px;bottom:16px;z-index:8;
border:1px solid #c19aff55;background:#171126bb;
color:#e7d8ff;padding:8px 13px;border-radius:30px;
font-size:11px;backdrop-filter:blur(12px)
}
.motion-control:hover{background:#6e48a5}
.motion-status{font-size:10px;color:#c7a8ff;margin-right:6px}

.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;gap:12px}
.section-head h2{font-size:23px}
.section-head p{color:var(--muted);font-size:13px;margin-top:5px}
.section{margin-bottom:45px}

.genre-grid,.region-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.region-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
.genre-card,.region-card{
min-height:155px;padding:23px;text-align:right;
border:1px solid var(--border);border-radius:20px;
background:linear-gradient(135deg,var(--genre-color),#171522 75%);
position:relative;overflow:hidden;transition:.35s;color:white;width:100%;
transform-style:preserve-3d;
box-shadow:inset 0 1px 1px #ffffff14,0 9px 22px #0005
}
.region-card{min-height:190px;background:linear-gradient(135deg,var(--region-color),#171522 80%)}
.genre-card:before,.region-card:before{
content:"";position:absolute;inset:0;
background:linear-gradient(125deg,#ffffff15,transparent 45%);
pointer-events:none
}
.genre-card:hover,.region-card:hover{
transform:translateY(-7px) perspective(700px) rotateX(3deg);
border-color:rgba(255,255,255,.3);
box-shadow:0 18px 35px #0008,0 0 22px #9b65ff22
}
.genre-card .symbol,.region-card .symbol{font-size:32px;margin-bottom:15px;text-shadow:0 0 18px #fff8}
.genre-card h3,.region-card h3{font-size:19px}
.genre-card p,.region-card p{font-size:12px;color:#d2cce0;margin-top:5px}
.genre-card .arrow,.region-card .arrow{position:absolute;left:20px;bottom:20px;font-size:22px;color:#fff9}

.artist-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px}
.artist-card{
cursor:pointer;background:linear-gradient(145deg,#1b192a,#11111b);
border:1px solid var(--border);border-radius:19px;overflow:hidden;
transition:.35s;box-shadow:0 8px 22px #0005;
transform-style:preserve-3d
}
.artist-card:hover{
transform:translateY(-8px) perspective(800px) rotateX(2deg);
border-color:rgba(180,130,255,.55);
box-shadow:0 18px 35px #0009,0 0 25px #9b65ff22
}
.artist-photo{
height:210px;position:relative;background:linear-gradient(135deg,#302044,#171725);
overflow:hidden;display:grid;place-items:center
}
.artist-photo img{width:100%;height:100%;object-fit:cover;display:block;transition:.45s}
.artist-card:hover img{transform:scale(1.07)}
.fallback{
position:absolute;inset:0;display:grid;place-items:center;
font-size:55px;color:#d5b6ff;
background:radial-gradient(circle at 30% 30%,#55336f,#21182f 65%,#141321);
pointer-events:none
}
.artist-info{padding:15px}
.artist-info h3{font-size:16px}
.artist-info p{font-size:12px;color:var(--muted);margin-top:5px}
.artist-info .genre-tag{display:inline-block;margin-top:11px;background:#9b65ff20;color:#c6a7ff;border-radius:20px;padding:4px 10px;font-size:11px}

.back-btn{border:1px solid var(--border);background:var(--panel);color:#ddd4f0;padding:9px 17px;border-radius:12px;margin-bottom:25px}
.back-btn:hover{border-color:var(--purple)}
.breadcrumb{color:var(--muted);font-size:13px;margin-bottom:20px}
.breadcrumb span{color:#c59cff}
.page-title{font-size:28px;margin-bottom:8px}
.page-desc{color:var(--muted);font-size:14px;margin-bottom:28px}

.artist-banner{
display:flex;align-items:center;gap:25px;
background:linear-gradient(110deg,#211832,#151421);
border:1px solid var(--border);padding:25px;
border-radius:22px;margin-bottom:35px;
box-shadow:0 15px 35px #0006,inset 0 1px #ffffff10
}
.artist-banner-photo{width:150px;height:150px;flex-shrink:0;position:relative;overflow:hidden;border-radius:18px;background:linear-gradient(135deg,#55336f,#21182f)}
.artist-banner-photo img{width:100%;height:100%;object-fit:cover;display:block}
.artist-banner h1{font-size:29px}
.artist-banner p{color:var(--muted);margin-top:8px;font-size:13px;line-height:2}

.track-list{display:flex;flex-direction:column;gap:10px}
.track{display:flex;align-items:center;gap:15px;padding:15px 18px;border:1px solid var(--border);background:var(--panel);border-radius:15px;transition:.2s}
.track:hover{background:var(--panel2)}
/* YUEORA: visually highlight the song that is currently playing */
.track.is-currently-playing{
  background:linear-gradient(105deg,rgba(108,99,255,.25),rgba(41,199,216,.16) 58%,rgba(108,99,255,.12))!important;
  border:1px solid rgba(89,190,255,.72)!important;
  box-shadow:0 9px 24px rgba(41,145,220,.20),0 0 0 1px rgba(108,99,255,.16),inset 0 1px rgba(255,255,255,.10)!important;
  transform:translateY(-3px) scale(1.006);
  position:relative;z-index:2;
}
.track.is-currently-playing .track-detail h4{color:#79e6f2!important;font-weight:800!important;text-shadow:0 0 13px rgba(41,199,216,.24)}
.track.is-currently-playing .track-number{color:#79e6f2!important;font-weight:800}
.track.is-currently-playing .track-cover{box-shadow:0 0 0 2px rgba(121,230,242,.48),0 0 22px rgba(41,199,216,.36)!important}
body[data-theme="light"] .track.is-currently-playing{
  background:linear-gradient(105deg,rgba(146,120,232,.25),rgba(66,195,200,.20) 58%,rgba(146,120,232,.14))!important;
  border:1px solid rgba(104,139,224,.72)!important;
  box-shadow:0 9px 22px rgba(104,112,207,.20),0 0 0 1px rgba(146,120,232,.15),inset 0 1px #ffffff!important;
}
body[data-theme="light"] .track.is-currently-playing .track-detail h4,
body[data-theme="light"] .track.is-currently-playing .track-number{color:#6653c5!important;text-shadow:none}
body[data-theme="light"] .track.is-currently-playing .track-cover{box-shadow:0 0 0 2px rgba(102,83,197,.32),0 0 18px rgba(66,195,200,.30)!important}

.track-number{color:#8d829f;width:24px}
.track-cover{width:47px;height:47px;display:grid;place-items:center;border-radius:11px;background:linear-gradient(135deg,#593d82,#b45caa);font-size:20px;box-shadow:0 5px 14px #0006}
.track-detail{flex:1}
.track-detail h4{font-size:14px}.track.is-currently-playing .track-detail h4{font-weight:900!important}
.track-detail p{font-size:11px;color:var(--muted);margin-top:3px}
.play-btn{width:38px;height:38px;border-radius:50%;border:1px solid #a77aff66;background:#9b65ff20;color:#d4baff;font-size:15px}
.play-btn:hover{background:var(--purple);color:white}

.search-box{width:100%;background:var(--panel);border:1px solid var(--border);padding:14px 18px;color:white;border-radius:13px;outline:none;margin-bottom:25px}
.search-box:focus{border-color:var(--purple)}
.empty{color:var(--muted);text-align:center;padding:40px;line-height:2}

.menu-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:29}
.side-menu{position:fixed;z-index:30;top:0;right:-340px;width:min(320px,85vw);height:100vh;background:#11101b;border-left:1px solid var(--border);padding:25px;transition:.3s;overflow:auto}
.side-menu.open{right:0}
.menu-overlay.open{display:block}
.menu-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}
.menu-close{border:0;background:none;color:white;font-size:25px}
.menu-link{display:block;width:100%;padding:13px 10px;text-align:right;background:none;border:0;border-bottom:1px solid var(--border);color:#ddd6eb}
.menu-link:hover{color:#c39aff}
.menu-label{display:flex;align-items:center;justify-content:space-between;width:100%;color:#eee5ff;font-size:14px;font-weight:700;margin:12px 0 0;padding:14px 12px;background:#9b65ff12;border:1px solid #9b65ff30;border-radius:12px;text-align:right;cursor:pointer}
.menu-label:hover{background:#9b65ff22;border-color:#9b65ff66}
.menu-region-content{display:none;padding:7px 5px 10px}
.menu-region-content.open{display:block}
.menu-chevron{font-size:12px;color:#b99be9;transition:transform .2s}
.menu-label[aria-expanded="true"] .menu-chevron{transform:rotate(180deg)}
.menu-genre{display:block;width:100%;text-align:right;border:0;background:none;color:#d6d0e2;padding:9px 12px;border-radius:9px}
.menu-genre:hover{background:#9b65ff20;color:white}
.menu-sub{display:none;padding-right:13px;border-right:1px solid #9b65ff55;margin:4px 0 10px}
.menu-sub.open{display:block}
.menu-sub button{font-size:12px;color:#aaa0bd}

.group-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.group-card{cursor:pointer;background:linear-gradient(145deg,#1b192a,#11111b);border:1px solid var(--border);border-radius:20px;overflow:hidden;transition:.35s;box-shadow:0 8px 22px #0005}
.group-card:hover{transform:translateY(-8px);border-color:#b58aff88;box-shadow:0 18px 35px #0009}
.group-photo{height:205px;background:linear-gradient(135deg,#302044,#171725);display:grid;place-items:center;overflow:hidden;color:#d5b6ff;font-size:55px;position:relative}
.group-photo img{width:100%;height:100%;object-fit:cover;display:block}
.group-info{padding:16px}
.group-info h3{font-size:18px}
.group-info p{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.8}
.group-banner{display:flex;gap:24px;align-items:center;padding:24px;background:linear-gradient(110deg,#211832,#151421);border:1px solid var(--border);border-radius:22px;margin-bottom:32px;box-shadow:0 15px 35px #0006}
.group-banner-photo{width:190px;height:155px;flex-shrink:0;position:relative;overflow:hidden;border-radius:16px;background:linear-gradient(135deg,#55336f,#21182f)}
.group-banner-photo img{width:100%;height:100%;object-fit:cover;display:block}
.photo-credit{position:absolute;left:7px;bottom:6px;z-index:2;padding:3px 6px;border-radius:6px;background:#080710c9;color:#fff;font-size:9px;line-height:1.35;direction:ltr;text-align:left;max-width:calc(100% - 14px)}
.group-banner h1{font-size:30px}
.group-banner p{font-size:13px;color:var(--muted);margin-top:8px;line-height:2}

.member-list{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px}
.member-card{cursor:pointer;text-align:right;overflow:hidden;border-radius:16px;background:var(--panel);border:1px solid var(--border);transition:.25s;color:var(--text);padding:0}
.member-card:hover{transform:translateY(-5px);border-color:var(--purple);background:var(--panel2)}
.member-photo{height:155px;position:relative;overflow:hidden;background:linear-gradient(135deg,#55336f,#21182f);display:grid;place-items:center}
.member-photo img{width:100%;height:100%;object-fit:cover;display:block}
.member-info{padding:12px}
.member-info strong{display:block;font-size:14px}
.member-info small{display:block;color:var(--muted);font-size:11px;margin-top:5px}
.group-section{margin-bottom:38px}
.group-section .section-head{margin-bottom:18px}

footer{border-top:1px solid var(--border);text-align:center;color:var(--muted);padding:30px 15px;font-size:12px}
.player{position:fixed;bottom:0;left:0;right:0;z-index:15;min-height:66px;background:rgba(18,17,29,.96);border-top:1px solid var(--border);backdrop-filter:blur(18px);display:flex;justify-content:space-between;align-items:center;padding:10px 5%;gap:15px}
.player-info{font-size:13px}
.player-info small{display:block;color:var(--muted);margin-top:3px}
.player-state{color:#b994ff;font-size:12px}
/* Echora full player */
.player{display:grid;grid-template-columns:minmax(170px,1fr) minmax(260px,1.35fr) minmax(150px,1fr);align-items:center;min-height:92px;padding:10px 3%;gap:22px}
.player-track{display:flex;align-items:center;gap:12px;min-width:0}
.player-info[role="button"]{cursor:pointer}.player-info[role="button"]:active{opacity:.75}.player-download{flex:0 0 auto;text-decoration:none;font-size:22px!important;color:var(--cyan)!important;padding:7px!important;border:1px solid var(--border);border-radius:10px}.player-download[aria-disabled="true"]{opacity:.35;pointer-events:none}
.player-cover{width:54px;height:54px;flex:0 0 54px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,#6c63ff,#29c7d8);color:white;font-size:25px;box-shadow:0 5px 18px #6c63ff35}
.player-info{min-width:0;max-width:100%}.player-info strong,.player-info small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.player-center{min-width:0;width:100%;max-width:560px;justify-self:center}.player-controls{display:flex;align-items:center;justify-content:center;gap:17px;margin-bottom:8px}.player-icon{border:0;background:transparent;color:var(--muted);font-size:19px;cursor:pointer;padding:5px;line-height:1}.player-icon:hover,.player-icon.active{color:var(--cyan)}.player-main-play{width:37px;height:37px;border:0;border-radius:50%;background:linear-gradient(135deg,var(--purple),var(--cyan));color:white;font-size:15px;cursor:pointer;box-shadow:0 4px 16px #6c63ff40}.player-timeline{display:flex;align-items:center;gap:9px;color:var(--muted);font-size:10px;font-variant-numeric:tabular-nums}.player-timeline input{flex:1;min-width:0;accent-color:var(--purple);height:4px;cursor:pointer}.player-extra{display:flex;align-items:center;justify-content:flex-end;gap:10px;min-width:0}.player-extra .player-state{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.player-extra input{width:82px;accent-color:var(--cyan);height:4px}.player-icon:disabled,.player-main-play:disabled{opacity:.4;cursor:not-allowed}
@media(max-width:700px){.player{grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;min-height:112px;padding:8px 12px calc(8px + env(safe-area-inset-bottom))}.player-track{grid-column:1;grid-row:1}.player-cover{width:42px;height:42px;flex-basis:42px}.player-center{grid-column:1 / -1;grid-row:2;max-width:none}.player-controls{gap:22px;margin-bottom:5px}.player-extra{grid-column:2;grid-row:1;gap:6px}.player-extra .player-state{display:none}.player-extra input{width:58px}.player-icon{font-size:17px}.player-main-play{width:33px;height:33px}.player-info{font-size:12px}.player-info small{font-size:10px}}

@media(max-width:850px){
.artist-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
.genre-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
.group-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
.member-list{grid-template-columns:repeat(3,minmax(0,1fr))}
nav{display:none}.menu-btn{display:block}
}
@media(max-width:560px){
main{padding:22px 4% 110px}
.hero{padding:30px 22px;min-height:260px}
.hero-orb{left:-100px}
.hero-content{max-width:100%}
.motion-control{left:12px;bottom:10px;font-size:10px}
.artist-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.artist-photo{height:170px}
.artist-info{padding:12px}
.genre-grid{gap:12px}
.genre-card{min-height:135px;padding:17px}
.region-grid{gap:12px}
.region-card{min-height:155px;padding:17px}
.artist-banner{align-items:flex-start;gap:15px;padding:16px}
.artist-banner-photo{width:105px;height:125px}
.artist-banner h1{font-size:21px}
.artist-banner p{font-size:11px}
.page-title{font-size:23px}
.player{padding:10px 4%}
.group-grid{grid-template-columns:repeat(1,minmax(0,1fr));gap:13px}
.group-photo{height:190px}
.group-banner{align-items:flex-start;gap:14px;padding:15px}
.group-banner-photo{width:110px;height:115px}
.group-banner h1{font-size:21px}
.group-banner p{font-size:11px}
.member-list{grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
.member-photo{height:145px}
}
@media(prefers-reduced-motion:reduce){
*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}


/* Personal library: favorites and playlists */
.library-btn{border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:11px;padding:8px 12px;font-size:12px;white-space:nowrap}
.library-btn:hover{border-color:var(--purple);background:var(--panel2)}
.artist-card,.group-card{position:relative}
.card-favorite{position:absolute;top:10px;inset-inline-end:10px;z-index:4;width:36px;height:36px;border-radius:50%;border:1px solid #ffffff40;background:#090b14c9;color:#fff;font-size:19px;display:grid;place-items:center;backdrop-filter:blur(8px)}
.card-favorite.active,.favorite-action.active{color:#ff6f9f;border-color:#ff6f9f66;background:#ff6f9f18}
.artist-banner-actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}
.favorite-action,.playlist-action{border:1px solid var(--border);background:var(--panel2);color:var(--text);border-radius:10px;padding:8px 12px;font-size:12px}
.favorite-action:hover,.playlist-action:hover{border-color:var(--purple)}
.track-actions{display:flex;gap:7px;margin-inline-start:auto;align-items:center}

.lyrics-section{
  position:relative; isolation:isolate; overflow:hidden;
  margin-top:28px!important; padding:clamp(18px,3.5vw,30px)!important;
  border:1px solid color-mix(in srgb,var(--purple) 22%,var(--border))!important;
  border-radius:26px!important;
  background:
    radial-gradient(ellipse at 8% 0%,rgba(108,99,255,.13),transparent 38%),

}
.lyrics-section:before{content:"♫";position:absolute;z-index:-1;left:18px;top:-32px;font-size:150px;line-height:1;color:var(--purple);opacity:.045;transform:rotate(-13deg);pointer-events:none}

.lyrics-section .section-head>div{display:grid;gap:5px}

const ECHORA_LIBRARY_KEY="ekora-personal-library-v1";
function readPersonalLibrary(){try{const value=JSON.parse(localStorage.getItem(ECHORA_LIBRARY_KEY)||"{}");return {favorites:Array.isArray(value.favorites)?value.favorites:[],playlists:Array.isArray(value.playlists)?value.playlists:[]};}catch(e){return {favorites:[],playlists:[]};}}
let personalLibrary=readPersonalLibrary();
function savePersonalLibrary(){try{localStorage.setItem(ECHORA_LIBRARY_KEY,JSON.stringify(personalLibrary));}catch(e){}}
function favoriteExists(type,id){return personalLibrary.favorites.some(item=>item.type===type&&item.id===id);}
function toggleFavorite(type,id,meta={}){const index=personalLibrary.favorites.findIndex(item=>item.type===type&&item.id===id);if(index>=0)personalLibrary.favorites.splice(index,1);else personalLibrary.favorites.push({type,id,...meta});savePersonalLibrary();if(location.hash==="#library")showLibrary();else if(type==="artist"&&location.hash==="#artist/"+id)renderArtist(id);else if(type==="group"&&location.hash==="#group/"+id)renderGroup(id);else document.querySelectorAll(`[data-favorite-type="${type}"][data-favorite-id="${id}"]`).forEach(button=>{const active=favoriteExists(type,id);button.classList.toggle("active",active);button.textContent=active?"♥":"♡";});}
function trackFavoriteId(song,artist){return artist+"\u241f"+song;}
function htmlJsArg(value){return JSON.stringify(String(value)).replace(/\"/g,"&quot;");}
function toggleTrackFavorite(song,artist){toggleFavorite("track",trackFavoriteId(song,artist),{song,artist});}
function createPlaylist(){const input=document.getElementById("newPlaylistName");if(!input)return;const name=input.value.trim();if(!name)return;personalLibrary.playlists.push({id:"pl-"+Date.now().toString(36)+Math.random().toString(36).slice(2,6),name,tracks:[]});savePersonalLibrary();showLibrary();}
function addTrackToPlaylist(song,artist){if(!personalLibrary.playlists.length){personalLibrary.playlists.push({id:"pl-"+Date.now().toString(36),name:"My Playlist",tracks:[]});}let playlist=personalLibrary.playlists[0];if(personalLibrary.playlists.length>1){const choices=personalLibrary.playlists.map((p,i)=>`${i+1}. ${p.name}`).join("\n");const answer=prompt("Choose a playlist by number:\n"+choices,"1");if(answer===null)return;const index=Number(answer)-1;if(!Number.isInteger(index)||index<0||index>=personalLibrary.playlists.length)return;playlist=personalLibrary.playlists[index];}if(!playlist.tracks.some(t=>t.song===song&&t.artist===artist))playlist.tracks.push({song,artist});savePersonalLibrary();const state=document.getElementById("playerState");if(state)state.textContent="Added to "+playlist.name;}
function removePlaylistTrack(playlistId,index){const p=personalLibrary.playlists.find(x=>x.id===playlistId);if(p){p.tracks.splice(index,1);savePersonalLibrary();showLibrary();}}
function deletePlaylist(playlistId){personalLibrary.playlists=personalLibrary.playlists.filter(p=>p.id!==playlistId);savePersonalLibrary();showLibrary();}
function showLibrary(){location.hash="library";closeMenu();const artistFavs=personalLibrary.favorites.filter(x=>x.type==="artist").map(x=>artists.find(a=>a.id===x.id)).filter(Boolean);const groupFavs=personalLibrary.favorites.filter(x=>x.type==="group").map(x=>groups.find(g=>g.id===x.id)).filter(Boolean);const trackFavs=personalLibrary.favorites.filter(x=>x.type==="track");document.getElementById("app").innerHTML=`
<h1 class="page-title">کتابخانه من</h1><p class="page-desc">هنرمندان و آهنگ‌های محبوبت را نگه دار و پلی‌لیست‌های خودت را بساز. اطلاعات فقط در همین مرورگر ذخیره می‌شود.</p>
<section class="library-section"><h2>هنرمندان محبوب · ${artistFavs.length}</h2>${artistFavs.length?`<div class="artist-grid">${artistFavs.map(artistCard).join("")}</div>`:`<div class="library-empty">هنوز هنرمندی به علاقه‌مندی‌ها اضافه نکردی.</div>`}</section>
<section class="library-section"><h2>گروه‌های محبوب · ${groupFavs.length}</h2>${groupFavs.length?`<div class="group-grid">${groupFavs.map(groupCard).join("")}</div>`:`<div class="library-empty">هنوز گروهی ذخیره نشده است.</div>`}</section>
<section class="library-section"><h2>آهنگ‌های محبوب · ${trackFavs.length}</h2>${trackFavs.length?`<div class="track-list">${trackFavs.map(t=>`<div class="track"><div class="track-cover">♫</div><div class="track-detail"><h4 data-no-translate>${t.song}</h4><p data-no-translate>${t.artist}</p></div><div class="track-actions"><button class="favorite-action active" aria-label="Remove favorite" onclick="toggleTrackFavorite(${htmlJsArg(t.song)},${htmlJsArg(t.artist)})">♥</button><button class="playlist-action" onclick="addTrackToPlaylist(${htmlJsArg(t.song)},${htmlJsArg(t.artist)})">＋</button></div></div>`).join("")}</div>`:`<div class="library-empty">هنوز آهنگی به علاقه‌مندی‌ها اضافه نکردی.</div>`}</section>
<section class="library-section"><h2>پلی‌لیست‌های من · ${personalLibrary.playlists.length}</h2><form class="playlist-create" onsubmit="event.preventDefault();createPlaylist()"><input id="newPlaylistName" maxlength="40" placeholder="نام پلی‌لیست جدید" aria-label="Playlist name"><button type="submit">＋ ساخت پلی‌لیست</button></form>${personalLibrary.playlists.length?personalLibrary.playlists.map(p=>`<div class="playlist-card"><div class="playlist-card-head"><h3 data-no-translate>♫ ${p.name}</h3><button class="playlist-delete" onclick="deletePlaylist('${p.id}')">حذف پلی‌لیست</button></div>${p.tracks.length?p.tracks.map((t,i)=>`<div class="playlist-track"><span>♫</span><div><strong data-no-translate>${t.song}</strong><small data-no-translate>${t.artist}</small></div><button aria-label="Remove track" onclick="removePlaylistTrack('${p.id}',${i})">✕</button></div>`).join(""):`<div class="library-empty">این پلی‌لیست هنوز آهنگی ندارد. از صفحه هنرمندان آهنگ اضافه کن.</div>`}</div>`).join(""):`<div class="library-empty">هنوز پلی‌لیستی نساختی. اولین پلی‌لیستت رو همین‌جا بساز!</div>`}</section>`;loadVisiblePhotos();}

function artistCard(a){
const tag=artistGenres(a).map(g=>g.name).join("، ");
return `<article class="artist-card" onclick="openArtist('${a.id}')">
<button class="card-favorite ${favoriteExists("artist",a.id)?"active":""}" data-favorite-type="artist" data-favorite-id="${a.id}" aria-label="Toggle favorite" onclick="event.stopPropagation();toggleFavorite('artist','${a.id}')">${favoriteExists("artist",a.id)?"♥":"♡"}</button>
<div class="artist-photo" id="photo-${a.id}">${fallbackHTML("✧")}</div>
<div class="artist-info"><h3 data-no-translate>${a.name}</h3><p data-no-translate>${a.latin}</p><span class="genre-tag">${tag}</span></div>
</article>`;
}
function groupCard(g){
return `<article class="group-card" onclick="openGroup('${g.id}')">
<button class="card-favorite ${favoriteExists("group",g.id)?"active":""}" data-favorite-type="group" data-favorite-id="${g.id}" aria-label="Toggle favorite" onclick="event.stopPropagation();toggleFavorite('group','${g.id}')">${favoriteExists("group",g.id)?"♥":"♡"}</button>
<div class="group-photo" id="group-photo-${g.id}">${fallbackHTML("✦")}</div>
<div class="group-info"><h3 data-no-translate>${g.name}</h3><p>${g.memberIds.length} عضو · K-Pop</p></div>
</article>`;
}

/* بارگذاری عکس‌ها فقط نزدیک viewport؛ اولویت پایین برای جلوگیری از رقابت با رابط کاربری. */
const ekoraPhotoObserver=("IntersectionObserver" in window)?new IntersectionObserver(entries=>{
entries.forEach(entry=>{
if(!entry.isIntersecting)return;
const img=entry.target;
ekoraPhotoObserver.unobserve(img);
if(img.dataset.src){
  img.loading="eager"; // خود IntersectionObserver زمان شروع درخواست را کنترل می‌کند
  img.fetchPriority="low";
  img.src=img.dataset.src;
  delete img.dataset.src;
}
});
},{rootMargin:"180px 0px",threshold:0.01}):null;
function setImageInElement(element,photo,alt,symbol="✧"){
if(!element||!photo)return;
const existing=element.querySelector("img");
if(existing&&(existing.dataset.src===photo||existing.currentSrc===photo||existing.src===photo))return;
const img=document.createElement("img");
img.alt=alt;img.loading=ekoraPhotoObserver?"lazy":"eager";img.decoding="async";
img.fetchPriority="low";img.referrerPolicy="no-referrer";
img.width=640;img.height=640;img.dataset.src=photo;
img.onerror=()=>{
  if(ekoraPhotoObserver)ekoraPhotoObserver.unobserve(img);
  img.remove();
  if(!element.querySelector(".fallback"))element.innerHTML=fallbackHTML(symbol);
};
element.innerHTML="";element.appendChild(img);
if(ekoraPhotoObserver)ekoraPhotoObserver.observe(img);
else{img.src=photo;delete img.dataset.src;}
}

const el=document.getElementById(id);if(el)setImageInElement(el,photo,a.name,symbol);

/* آهنگ‌ها */
function syncPlayingTrackRows(playing){
 const current=ekoraQueue[ekoraQueueIndex];
 const key=current?String(current.artist)+"::"+String(current.song):"";
 document.querySelectorAll(".track[data-track-key]").forEach(row=>{
  let rowKey=row.getAttribute("data-track-key")||"";
  try{rowKey=decodeURIComponent(rowKey);}catch(e){}
  const isCurrent=!!playing&&!!key&&rowKey===key;
  row.classList.toggle("is-currently-playing",isCurrent);
  const title=row.querySelector(".track-detail h4");
  if(title){if(isCurrent)title.style.setProperty("font-weight","900","important");else title.style.removeProperty("font-weight");}
 });
}
function renderTracks(songs,artistName){

return songs.map((song,i)=>{
const id=trackFavoriteId(song,artistName),active=favoriteExists("track",id);
return `<div class="track track-open" data-track-key="${encodeURIComponent(artistName+"::"+song)}" role="button" tabindex="0" onclick="openTrackPage(${htmlJsArg(song)},${htmlJsArg(artistName)},${i},${htmlJsArg(JSON.stringify(songs))})" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openTrackPage(${htmlJsArg(song)},${htmlJsArg(artistName)},${i},${htmlJsArg(JSON.stringify(songs))})}"><div class="track-number">${String(i+1).padStart(2,"0")}</div><div class="track-cover">♫</div><div class="track-detail"><h4 data-no-translate>${song}</h4><p data-no-translate>${yueoraTrackArtistLabel(song,artistName)}</p><small class="track-open-hint">ورود به صفحه پخش و متن آهنگ ←</small></div><div class="track-actions"><button class="favorite-action ${active?"active":""}" aria-label="Toggle favorite song" onclick="event.stopPropagation();toggleTrackFavorite(${htmlJsArg(song)},${htmlJsArg(artistName)})">${active?"♥":"♡"}</button><button class="playlist-action" aria-label="Add to playlist" onclick="event.stopPropagation();addTrackToPlaylist(${htmlJsArg(song)},${htmlJsArg(artistName)})">＋</button><button class="play-btn" aria-label="Open song player" onclick="event.stopPropagation();openTrackPage(${htmlJsArg(song)},${htmlJsArg(artistName)},${i},${htmlJsArg(JSON.stringify(songs))})">▶</button></div></div>`;

function yueoraTrackArtistLabel(song, fallbackArtistName){
 const dynamicKey=String(fallbackArtistName||"")+"::"+String(song||"");
 if(window.YUEORA_DB_CREDITS && window.YUEORA_DB_CREDITS[dynamicKey])return window.YUEORA_DB_CREDITS[dynamicKey];
 const normalize=value=>String(value||"").trim().replace(/[يى]/g,"ی").replace(/ك/g,"ک").replace(/[‌‎‏]/g,"").replace(/\s+/g,"").toLowerCase();
 const normalized=normalize(song);
 const artistKey=String(fallbackArtistName||"").trim()+"::"+String(song||"").trim();
 if(Object.prototype.hasOwnProperty.call(YUEORA_COLLABORATION_CREDITS,artistKey))return YUEORA_COLLABORATION_CREDITS[artistKey];
 const key=Object.keys(YUEORA_COLLABORATION_CREDITS).find(x=>normalize(x)===normalized);
 if(!key)return fallbackArtistName;
 const credit=YUEORA_COLLABORATION_CREDITS[key];
 const currentArtist=normalize(fallbackArtistName);
 const isParticipant=String(credit||"").split(/،|,| و /).some(part=>{
  const credited=normalize(part);
  return credited&&(credited===currentArtist||credited.includes(currentArtist)||currentArtist.includes(credited));
 });
 return isParticipant?credit:fallbackArtistName;
}

 const requested=normalize(song);

function searchArtists(value,targetId="searchResults"){
const target=document.getElementById(targetId);if(!target)return;
const q=String(value||"").trim().toLowerCase().replace(/ي/g,"ی").replace(/ك/g,"ک");
if(!q){target.innerHTML="";return;}
const norm=v=>String(v||"").toLowerCase().replace(/ي/g,"ی").replace(/ك/g,"ک");
const result=artists.filter(a=>norm(a.name+" "+a.latin+" "+artistGenres(a).map(g=>g.name).join(" ")+" "+a.bio).includes(q));
const groupResults=groups.filter(g=>norm(g.name+" "+g.latin+" K-Pop").includes(q));
const songResults=[];
artists.forEach(a=>(a.songs||[]).forEach((song,i)=>{if(norm(song).includes(q)||norm(a.name+" "+a.latin).includes(q)&&norm(song).includes(q)){songResults.push({artist:a,song,index:i});}}));
const songHtml=songResults.slice(0,30).map(({artist,song,index})=>`<div class="track track-open" role="button" tabindex="0" onclick="openTrackPage(${htmlJsArg(song)},${htmlJsArg(artist.name)},${index},${htmlJsArg(JSON.stringify(artist.songs||[song]))})" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openTrackPage(${htmlJsArg(song)},${htmlJsArg(artist.name)},${index},${htmlJsArg(JSON.stringify(artist.songs||[song]))})}"><div class="track-cover">♫</div><div class="track-detail"><h4 data-no-translate>${song}</h4><p data-no-translate>${yueoraTrackArtistLabel(song,artist.name)}</p></div><div class="track-actions"><button class="play-btn" aria-label="پخش ${song}" onclick="event.stopPropagation();openTrackPage(${htmlJsArg(song)},${htmlJsArg(artist.name)},${index},${htmlJsArg(JSON.stringify(artist.songs||[song]))})">▶</button></div></div>`).join("");
target.innerHTML=
(groupResults.length?`<h2 class="search-result-heading">گروه‌ها</h2><div class="group-grid">${groupResults.map(groupCard).join("")}</div>`:"")+
(result.length?`<h2 class="search-result-heading">هنرمندان</h2><div class="artist-grid">${result.map(artistCard).join("")}</div>`:"")+
(songHtml?`<h2 class="search-result-heading">آهنگ‌ها</h2><div class="track-list">${songHtml}</div>`:"")+
(!result.length&&!groupResults.length&&!songResults.length?`<div class="empty">نتیجه‌ای پیدا نشد.</div>`:"");

}
